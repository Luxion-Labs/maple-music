name: Android APK

# Builds a SIGNED RELEASE arm64 APK of Maple for Android.
#
# Every push to main gets a fresh installable APK (Actions ▸ latest run ▸ artifacts).
# workflow_dispatch stays for rebuilds/backfills with no code change.
#
# SIGNING: release APKs must be signed to install. If `maple-release.jks` isn't committed yet,
# this job mints one, signs with it, and uploads it as an artifact — download it once and commit
# it to the repo root, and every later build shares the same signature, so new APKs install over
# old ones. Until then, uninstall the previous build before installing (per-run key).
# The keystore/password being public is deliberate: this is a free client anyone builds from
# source; there is nothing here to protect. Rotate privately before ever shipping to Play.
#
# SIZE: release applies the workspace's [profile.release] (thin LTO, stripped symbols), which is
# why this is ~10× smaller than the debug APK this job used to produce (268 MB → ~30 MB).
#
# THE THREE NATIVE PIECES this job has to assemble that the desktop jobs get for free:
#   1. libmpv.so (arm64) — extracted from the official mpv-android release APK into jniLibs (for
#      APK packaging) AND into the NDK sysroot's triple lib dir, where the linker already
#      searches for `cargo:rustc-link-lib=mpv`. The sysroot copy is what makes linking work: the
#      Tauri CLI injects target-scoped RUSTFLAGS that would override any -L we export.
#   2. The Android project itself (`src-tauri/gen/android`) — gitignored, regenerated here by
#      `tauri android init`. Any manual tweak made locally must be reproducible in this step.
#   3. Cross-compile toolchain env — the Tauri CLI wires CC/AR/linker from NDK_HOME itself;
#      bindgen (via rquickjs-sys) additionally needs BINDGEN_EXTRA_CLANG_ARGS pointed at the NDK
#      sysroot or it parses quickjs.h against host headers and produces wrong-size bindings.

on:
  push:
    branches: [main]
    # Docs and the marketing site don't change the app — don't burn a 10-minute build on them.
    paths-ignore: ["website/**", "**/*.md", "assets/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned mpv-android release. Only lib/arm64-v8a/libmpv.so is used from inside it.
  MPV_ANDROID_APK_URL: https://github.com/mpv-android/mpv-android/releases/download/2026-08-11/app-default-arm64-v8a-release.apk
  JNI_DIR: src-tauri/gen/android/app/src/main/jniLibs/arm64-v8a

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Rust (stable + Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # pnpm before setup-node so `cache: pnpm` can find the binary — same shape as the other jobs.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # AGP wants JDK 17+; 21 is what the local machine has.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Frontend deps
        shell: bash
        run: cd ui && pnpm install --frozen-lockfile

      # Locate the NDK the runner ships and teach bindgen where the Android sysroot lives.
      # Without BINDGEN_EXTRA_CLANG_ARGS, rquickjs-sys's bindgen pass generates bindings sized
      # for the HOST and the quickjs build fails or misbehaves downstream.
      - name: Android toolchain env
        shell: bash
        run: |
          set -euo pipefail
          NDK="$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          [ -d "$TC/sysroot" ] || { echo "::error::NDK sysroot not found under $NDK"; exit 1; }
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=--sysroot=$TC/sysroot --target=aarch64-linux-android24" >> "$GITHUB_ENV"
          echo "NDK: $NDK"

      - name: Frontend build
        shell: bash
        run: (cd ui && pnpm build)

      # RUSTFLAGS note: the Tauri CLI injects its own target-scoped
      # CARGO_TARGET_*_RUSTFLAGS (-landroid -llog -lOpenSLES), which overrides any generic
      # RUSTFLAGS we export — so we don't fight it. Instead the libmpv.so below is copied into the
      # NDK sysroot's triple lib dir, where the linker already searches for `-lmpv`.

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          prefix-key: android-arm64

      # Prebuilt cargo-tauri, not the npm CLI: the Android gradle project's rustBuild tasks
      # resolve the CLI themselves, and a globally npm-installed one breaks there with
      # "Cannot find module …/src-tauri/tauri". The cargo subcommand is the shape the generated
      # gradle expects. Prebuilt binary — compiling tauri-cli costs ~5 min for nothing.
      - name: Tauri CLI
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli

      # Regenerates the gitignored Android project fresh each run. compileSdk/targetSdk come from
      # the CLI defaults; the runner's SDK manager picks up anything missing (licenses accepted).
      - name: Generate the Android project
        shell: bash
        run: cargo tauri android init

      - name: Extract libmpv.so (arm64) from mpv-android
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 120 -o /tmp/mpv-android.apk "$MPV_ANDROID_APK_URL"
          mkdir -p "$JNI_DIR"
          unzip -j -o /tmp/mpv-android.apk "lib/arm64-v8a/libmpv.so" -d "$JNI_DIR"

          # Second copy into the NDK sysroot's triple lib dir: the linker searches there for
          # `-lmpv`, and this survives the CLI's RUSTFLAGS injection (see note above).
          SYSROOT_LIB="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/24"
          cp "$JNI_DIR/libmpv.so" "$SYSROOT_LIB/libmpv.so"

          ls -la "$JNI_DIR" "$SYSROOT_LIB/libmpv.so"
          test -f "$JNI_DIR/libmpv.so" || { echo "::error::libmpv.so missing from mpv-android APK"; exit 1; }

      - name: Build the unsigned release APK (arm64)
        shell: bash
        # beforeBuildCommand emptied: we just ran `pnpm build` ourselves. Left on, tauri runs
        # `pnpm build` from the repo root, which has no package.json (see windows-release.yml).
        run: >
          cargo tauri android build --apk --target aarch64
          --config '{"build":{"beforeBuildCommand":""}}'

      # Mint the signing key only when it isn't committed yet; afterwards this is a no-op and
      # every run signs with the same key. Password/dname are public by design — see header.
      - name: Signing key (generate if absent)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f maple-release.jks ]; then
            keytool -genkeypair -keystore maple-release.jks -alias maple \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass maple -keypass maple -dname "CN=Maple"
            echo "::notice::minted a new maple-release.jks — download it from artifacts and commit it so future builds keep the same signature"
          else
            echo "using committed maple-release.jks"
          fi

      - name: Align + sign the APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="$(find src-tauri/gen/android/app/build/outputs/apk -name '*-unsigned.apk' | head -1)"
          [ -n "$UNSIGNED" ] || { echo "::error::no *-unsigned.apk produced"; exit 1; }
          ALIGNED="maple-arm64-aligned.apk"
          "$BT/zipalign" -f 4 "$UNSIGNED" "$ALIGNED"
          "$BT/apksigner" sign --ks maple-release.jks --ks-key-alias maple \
            --ks-pass pass:maple --key-pass pass:maple --out maple-mobile.apk "$ALIGNED"
          "$BT/apksigner" verify maple-mobile.apk
          ls -la maple-mobile.apk

      # Artifacts are not release assets — nothing user-facing ships from this job yet.
      - name: Upload the APK + keystore
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maple-android-release-arm64
          path: |
            maple-mobile.apk
            maple-release.jks
          if-no-files-found: error
          retention-days: 14
