name: Checks

# Two jobs:
#
# 1. `rustfmt` — formatting only, seconds, on every push/PR.
#
# WHY FMT STAYS SEPARATE AND CHEAP: PR #13 ran `cargo fmt` against a repo that had no
# `rustfmt.toml`, so rustfmt's defaults reformatted 21 files the change never touched and buried
# ~900 lines of real work inside a 2400-line diff. rustfmt parses without building, so this job
# stays cheap enough to run on every push.
#
# 2. `tests` — the compiler. fmt can't catch type errors or broken tests; until this job existed,
# nothing on push ever compiled (all build workflows are dispatch-only), so breakage could sit on
# main for weeks. Full workspace `cargo test` with the Linux system deps Tauri needs to build.
# Cold run ~15 min; cached runs a few minutes.
#
# If you add heavier gates later, keep them as separate jobs rather than weighing these down.

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR makes the earlier run irrelevant.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `components: rustfmt` rather than the default toolchain: nothing here compiles, so the rest
      # would only be download time.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # --all covers every workspace member, --check reports and exits non-zero instead of editing.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: How to fix
        if: failure()
        run: |
          echo "::notice::Run 'cargo fmt --all' locally and commit the result."
          echo "rustfmt.toml at the repo root matches the existing style, so this should only"
          echo "touch code you actually changed. If it wants to reformat files you never opened,"
          echo "please open an issue instead of committing the churn."

  # The compiler, finally. fmt parses but never builds — a type error or a broken unit test could
  # sit on main for weeks because every compiling workflow here is dispatch-only. This job is the
  # separate one the comment above prescribed: full workspace test run with the Linux system deps
  # Tauri needs to even build. First run pays a cold compile (~15 min); rust-cache makes the rest
  # a few minutes.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # What maple-app's build scripts probe for (glib/gtk/webkit via pkg-config) plus libmpv-dev:
      # crates/player links -lmpv and its mpv_keeps_the_gain test drives real libmpv headless
      # (nothing plays; no audio device opens). live_smoke stays out — it's behind the
      # integration-tests feature and default `cargo test` never enables it.
      - name: System deps (Tauri Linux + libmpv)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libxdo-dev libssl-dev libmpv-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: . -> target
          prefix-key: linux-tests

      - name: cargo test --workspace
        run: cargo test --workspace
