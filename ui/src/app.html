<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<script>
			// Boot-error trap. Runs before any bundle: if the SPA dies during module evaluation or
			// mount, the user sees the reason instead of a silent white screen (that is exactly how
			// the first Android build failed, with nothing to go on). Removed once Svelte mounts.
			window.__mapleErrors = [];
			var el = null;
			var show = function (msg) {
				try {
					window.__mapleErrors.push(String(msg));
					el = document.getElementById('maple-boot-errors') || null;
					if (!el) {
						var wrap = document.createElement('div');
						wrap.id = 'maple-boot-errors';
						wrap.style.cssText =
							'position:fixed;inset:auto 8px 8px 8px;z-index:99999;display:flex;' +
							'flex-direction:column;border-radius:8px;overflow:hidden;' +
							'border:1px solid #ff6b6b';
						var bar = document.createElement('div');
						bar.style.cssText =
							'display:flex;align-items:center;justify-content:space-between;' +
							'background:#2a1215;color:#ffb4b4;padding:6px 10px;font:12px monospace';
						bar.appendChild(document.createTextNode('Maple — startup errors'));
						var x = document.createElement('button');
						x.textContent = '\u00d7';
						x.setAttribute('aria-label', 'Dismiss error banner');
						x.style.cssText =
							'cursor:pointer;background:none;border:none;color:#ffb4b4;font:16px monospace;padding:0 4px';
						x.onclick = function () {
							// Dismiss only hides it; a new error re-opens the banner.
							if (el && el.parentNode) el.parentNode.removeChild(el);
							el = null;
						};
						bar.appendChild(x);
						var pre = document.createElement('pre');
						pre.style.cssText =
							'margin:0;padding:10px;max-height:40vh;overflow:auto;background:#1b1b1f;' +
							'color:#ff6b6b;font:12px/1.5 monospace;white-space:pre-wrap';
						wrap.appendChild(bar);
						wrap.appendChild(pre);
						document.body.appendChild(wrap);
						el = wrap;
					}
					el.querySelector('pre').textContent = window.__mapleErrors.join('\n---\n');
				} catch (_) {}
			};
			window.addEventListener('error', function (e) {
				show((e.error && e.error.stack) || e.message || e.filename);
			});
			window.addEventListener('unhandledrejection', function (e) {
				show('unhandled rejection: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
			});
			window.__mapleClearBootErrors = function () {
				var el = document.getElementById('maple-boot-errors');
				if (el) el.remove();
			};
		</script>
	</body>
</html>
