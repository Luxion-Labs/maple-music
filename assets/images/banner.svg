<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <linearGradient id="maple-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0605" />
      <stop offset="50%" stop-color="#1A0F0A" />
      <stop offset="100%" stop-color="#050302" />
    </linearGradient>
    <linearGradient id="orange-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
    <radialGradient id="maple-glow" cx="75%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0605" stop-opacity="0" />
    </radialGradient>
    <pattern id="audio-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#F97316" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#maple-bg)" />
  <rect width="1200" height="420" fill="url(#maple-glow)" />
  <rect width="1200" height="420" fill="url(#audio-grid)" />

  <rect x="20" y="20" width="1160" height="380" rx="14" fill="none" stroke="#F97316" stroke-width="1" stroke-opacity="0.2" />

  <!-- Vinyl Grooves & Frequency Spectrum Visualizer Art (Right Side) -->
  <g transform="translate(850, 210)">
    <!-- Vinyl Concentric Grooves -->
    <circle cx="0" cy="0" r="115" fill="#0D0705" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.2" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="8 4" />
    <circle cx="0" cy="0" r="75" fill="none" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="55" fill="none" stroke="#EF4444" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="6 3" />
    
    <!-- Central Gold Spindle Label -->
    <circle cx="0" cy="0" r="35" fill="#1C0D08" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="10" fill="#F59E0B" />

    <!-- Equalizer Spectrum Bars Radiating Upward -->
    <g transform="translate(-120, -110)">
      <rect x="0" y="40" width="6" height="30" rx="3" fill="#F97316" />
      <rect x="12" y="20" width="6" height="50" rx="3" fill="#F59E0B" />
      <rect x="24" y="5" width="6" height="65" rx="3" fill="#EF4444" />
      <rect x="36" y="25" width="6" height="45" rx="3" fill="#F97316" />
      <rect x="48" y="0" width="6" height="70" rx="3" fill="#F59E0B" />
      <rect x="60" y="15" width="6" height="55" rx="3" fill="#EF4444" />
      <rect x="72" y="35" width="6" height="35" rx="3" fill="#F97316" />
      <rect x="84" y="10" width="6" height="60" rx="3" fill="#F59E0B" />
      <rect x="96" y="25" width="6" height="45" rx="3" fill="#EF4444" />
      <rect x="108" y="45" width="6" height="25" rx="3" fill="#F97316" />
    </g>

    <text x="0" y="145" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11" letter-spacing="1" text-anchor="middle">TAURI 2.0: MEMORY LEAN (&lt;30MB RSS)</text>
  </g>

  <!-- Content (Left Side) -->
  <g transform="translate(70, 75)">
    <rect width="250" height="30" rx="15" fill="#F97316" fill-opacity="0.12" stroke="#F97316" stroke-width="1" stroke-opacity="0.4" />
    <circle cx="16" cy="15" r="4" fill="#F97316" />
    <text x="28" y="19" fill="#FB923C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">NATIVE RUST AUDIO ENGINE</text>

    <text x="0" y="85" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">
      Maple
    </text>

    <rect x="0" y="105" width="85" height="4" rx="2" fill="url(#orange-gold)" />

    <text x="0" y="150" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="-0.2">
      Lightweight, high-performance terminal and native audio player written in Rust.
    </text>

    <text x="0" y="180" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Ad-free YouTube Music desktop client powered by Tauri 2.0 without Electron bloat.
    </text>

    <g transform="translate(0, 240)">
      <rect width="170" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="14" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">LANGUAGE: RUST</text>

      <rect x="185" y="0" width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="199" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SHELL: TAURI 2.0</text>

      <rect x="380" y="0" width="160" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.03" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />
      <text x="394" y="22" fill="#94A3B8" font-family="'SF Mono', monospace" font-size="11">SLA: 24H RESPONSE</text>
    </g>
  </g>
</svg>